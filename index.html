<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydraulic Floor Generator</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="hero-title">Hydraulic Floor Generator</h1>
            <div class="hero-flourish" aria-hidden="true"></div>
            <p class="hero-subtitle">Create beautiful hexagonal floor designs</p>
        </header>

        <div class="controls">
            <div class="grid-size-controls">
                <h3>Floor Size</h3>
                <div class="size-inputs">
                    <label>
                        Width: <input type="number" id="grid-width" min="5" max="50" value="12"> tiles
                    </label>
                    <label>
                        Height: <input type="number" id="grid-height" min="5" max="30" value="10"> tiles
                    </label>
                    <div class="size-actions">
                        <button id="resize-grid" class="resize-btn">Resize Floor</button>
                        <button id="auto-fill" class="auto-fill-btn">Generate Beautiful Design</button>
                    </div>
                </div>
            </div>

            <div class="color-palette">
                <h3>Select Color</h3>
                <div class="color-options">
                    <button class="color-item" type="button" data-color="#2C3E50">
                        <span class="color-option" style="background-color: #2C3E50;"></span>
                        <span class="color-name">Navy</span>
                    </button>
                    <button class="color-item" type="button" data-color="#8B3A3A">
                        <span class="color-option" style="background-color: #8B3A3A;"></span>
                        <span class="color-name">Burgundy</span>
                    </button>
                    <button class="color-item" type="button" data-color="#F5F5DC">
                        <span class="color-option" style="background-color: #F5F5DC;"></span>
                        <span class="color-name">Cream</span>
                    </button>
                    <button class="color-item" type="button" data-color="#CD853F">
                        <span class="color-option" style="background-color: #CD853F;"></span>
                        <span class="color-name">Terracotta</span>
                    </button>
                    <button class="color-item" type="button" data-color="#D3D3D3">
                        <span class="color-option" style="background-color: #D3D3D3;"></span>
                        <span class="color-name">Light Gray</span>
                    </button>
                    <button class="color-item" type="button" data-color="#A9A9A9">
                        <span class="color-option" style="background-color: #A9A9A9;"></span>
                        <span class="color-name">Medium Gray</span>
                    </button>
                    <button class="color-item" type="button" data-color="#F5DEB3">
                        <span class="color-option" style="background-color: #F5DEB3;"></span>
                        <span class="color-name">Beige</span>
                    </button>
                    <button class="color-item" type="button" data-color="#C0C0C0">
                        <span class="color-option" style="background-color: #C0C0C0;"></span>
                        <span class="color-name">Warm Gray</span>
                    </button>
                    <button class="color-item" type="button" data-color="#D4A5A5">
                        <span class="color-option" style="background-color: #D4A5A5;"></span>
                        <span class="color-name">Dusty Rose</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="floor-grid-container">
            <div class="color-summary-card color-summary-floating is-hidden">
                <h3>Color Summary</h3>
                <div id="color-summary" class="color-summary-content"></div>
            </div>
            <div id="floor-grid" class="floor-grid"></div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
